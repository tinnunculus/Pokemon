model:
  name: hiql
  action_dim: 7
  hidden_size: 256
  discrete: 1
  lr: 3e-4
  actor_hidden_dims: (256, 256)
  value_hidden_dims: (256, 256)
  discount: 0.99
  tau: 0.005
  temperature: 1.0
  high_temperature: 1.0
  pretrain_expectile: 0.7
  # Enables the high-level policy.  This is a boolean flag; the number of
  # environment decisions between a state and its waypoint is `way_steps`.
  use_waypoints: 1
  way_steps: 25
  use_rep: 1
  rep_dim: 10
  policy_train_rep: 0
  use_layer_norm: 1
  geom_sample: 1

dataset:
  path: offline_trajectories
  max_trajectories: null
  # NPZ files are compressed per trajectory. Keeping a batch local avoids
  # decompressing hundreds of full trajectories for a single update.
  trajectories_per_batch: 1

training:
  seed: 0
  batch_size: 256
  max_steps: 10000
  log_interval: 100
  log_path: hiql_train_log.csv
  save_interval: 1000
  checkpoint_dir: checkpoints/hiql_0804
  
